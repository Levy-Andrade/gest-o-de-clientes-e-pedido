version: '3.8'

services:
  # 1. Banco de Dados SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestao_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Strong_Password123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  # 2. Backend ASP.NET Core Web API (.NET 9)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestao_backend_api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - UseInMemoryDatabase=false
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GestaoClientesPedidosDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__Key=MinhaChaveSuperSecretaDeAltaSegurancaParaGestaoClientesPedidos2026!@#
      - Jwt__Issuer=GestaoClientesPedidosAPI
      - Jwt__Audience=GestaoClientesPedidosClient
      - Jwt__ExpireHours=12
    ports:
      - "5000:8080"
    networks:
      - app-network

  # 3. Frontend React 18 + TypeScript (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestao_frontend_spa
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "3000:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
